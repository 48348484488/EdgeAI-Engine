name: EdgeAI Android ARM64 CI

on:
  push:
    branches: [v0.12-multiblock]
    paths:
      - .github/workflows/android-arm64-ci.yml
      - CMakeLists.txt
      - include/**
      - src/**
      - examples/**
      - tools/**
      - scripts/android_adb_smoke.sh
      - scripts/android_adb_smoke.ps1
  workflow_dispatch:

concurrency:
  group: edgeai-android-arm64
  cancel-in-progress: true

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android NDK
        run: |
          test -n "${ANDROID_NDK_HOME:-}"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Configure Android arm64-v8a
        run: |
          cmake -S . -B build-android-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DBUILD_SHARED_LIBS=ON \
            -DEDGEAI_BUILD_TESTS=OFF \
            -DEDGEAI_BUILD_BENCHMARK=OFF

      - name: Build Android native targets
        run: cmake --build build-android-arm64 -j2

      - name: Verify Android ARM64 ELF outputs
        run: |
          test -f build-android-arm64/libedgeai.so
          test -f build-android-arm64/edgeai_chat
          file build-android-arm64/libedgeai.so
          file build-android-arm64/edgeai_chat
          readelf -h build-android-arm64/libedgeai.so | tee /tmp/edgeai-elf.txt
          grep -Eq 'Machine:[[:space:]]+AArch64' /tmp/edgeai-elf.txt
          readelf -d build-android-arm64/libedgeai.so | tee /tmp/edgeai-dynamic.txt
          ! grep -q 'libstdc++' /tmp/edgeai-dynamic.txt

      - name: Package Android arm64-v8a artifact
        run: |
          mkdir -p artifact/arm64-v8a
          cp build-android-arm64/libedgeai.so artifact/arm64-v8a/
          cp build-android-arm64/edgeai_chat artifact/arm64-v8a/
          cp build-android-arm64/edgeai_generate artifact/arm64-v8a/
          CXX_SHARED="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -path '*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so' -print -quit)"
          test -n "$CXX_SHARED"
          cp "$CXX_SHARED" artifact/arm64-v8a/libc++_shared.so
          cp scripts/android_adb_smoke.sh artifact/
          cp scripts/android_adb_smoke.ps1 artifact/
          {
            echo "abi=arm64-v8a"
            echo "platform=android-24"
            echo "stl=c++_shared"
            echo "note=cross-compiled only; physical Android runtime still unverified"
          } > artifact/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: edgeai-android-arm64-v8a
          path: artifact/
          if-no-files-found: error
