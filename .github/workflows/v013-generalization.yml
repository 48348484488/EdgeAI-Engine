name: EdgeAI v0.13 Generalization Ablation

on:
  push:
    branches: [v0.12-multiblock]
    paths:
      - .github/workflows/v013-generalization.yml
      - tools/instruction_data_v013.py
      - tests/test_v013_curriculum.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgeai-v013-generalization
  cancel-in-progress: true

jobs:
  generalization:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build v0.13 curriculum
        run: |
          python3 -m unittest tests.test_v013_curriculum
          python3 tools/instruction_data_v013.py

      - name: Verify sealed tests unchanged
        run: |
          for s in test_id test_template test_range test_family; do
            cmp "data/instructions_v07/$s.jsonl" "data/instructions_v013/$s.jsonl"
          done

      - name: Configure and build native evaluator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2

      - name: Install CPU Python dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3'

      - name: Train one and two blocks on v0.13 curriculum
        run: |
          python3 benchmarks/instruction_blocks_v012.py             --cpu-seconds 60             --seeds 11 22 33             --threads 1             --architectures 1 2             --data data/instructions_v013             --out results/v013/training.json             --model-dir models/v013

      - name: Native sealed-test evaluation
        run: |
          python3 benchmarks/instruction_blocks_eval_v012.py             --build build             --report results/v013/training.json             --data data/instructions_v013             --out results/v013/evaluation.json

      - name: Compare generalization
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('results/v012/evaluation.json').read_text())
          new=json.loads(Path('results/v013/evaluation.json').read_text())
          def summarize(report):
              out={}
              for r in report['runs']:
                  out[(r['seed'],r['blocks'])]=dict(
                      total=r['summary']['correct'],
                      range=r['by_split']['test_range']['correct'],
                      family=r['by_split']['test_family']['correct'],
                      template=r['by_split']['test_template']['correct'],
                      iid=r['by_split']['test_id']['correct'])
              return out
          a,b=summarize(old),summarize(new)
          rows=[]
          for key in sorted(b):
              prev=a.get(key,{})
              cur=b[key]
              rows.append(dict(seed=key[0],blocks=key[1],
                               old_total=prev.get('total'),new_total=cur['total'],
                               old_range=prev.get('range'),new_range=cur['range'],
                               old_family=prev.get('family'),new_family=cur['family'],
                               old_template=prev.get('template'),new_template=cur['template'],
                               old_iid=prev.get('iid'),new_iid=cur['iid']))
          out=dict(protocol='v0.12 frozen baseline versus v0.13 train-only curriculum expansion; sealed tests byte-identical',
                   rows=rows)
          Path('results/v013/generalization_comparison.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-v013-generalization
          path: |
            results/v013/
            data/instructions_v013/manifest.json
            models/v013/

      - name: Commit compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v013/ data/instructions_v013/
          git commit -m "bench: record v0.13 generalization ablation" || exit 0
          git fetch origin v0.12-multiblock
          git rebase origin/v0.12-multiblock
          git push origin HEAD:v0.12-multiblock
