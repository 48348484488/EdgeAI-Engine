name: EdgeAI Android Emulator CI

on:
  push:
    branches: [v0.12-multiblock]
    paths:
      - .github/workflows/android-emulator-ci.yml
      - android/**
      - CMakeLists.txt
      - include/**
      - src/**
  workflow_dispatch:

concurrency:
  group: edgeai-android-emulator
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build x86_64 emulator APK
        working-directory: android
        run: gradle :app:assembleDebug -PedgeaiAbi=x86_64 --stacktrace

      - name: Run Android OS smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"

            adb logcat -c
            adb shell am start -W -n com.edgeai.smoke/.MainActivity --es prompt "Subtract 17 from 42"
            sleep 2
            adb logcat -d -s EDGEAI_SMOKE:I '*:S' | tee /tmp/edgeai-calc.log
            grep -q "25.*route=calculator.*neural=0" /tmp/edgeai-calc.log

            adb shell am force-stop com.edgeai.smoke
            adb logcat -c
            adb shell am start -W -n com.edgeai.smoke/.MainActivity --es prompt "neural smoke"
            sleep 2
            adb logcat -d -s EDGEAI_SMOKE:I '*:S' | tee /tmp/edgeai-neural.log
            grep -q "route=neural.*neural=1" /tmp/edgeai-neural.log

            adb shell dumpsys meminfo com.edgeai.smoke | tee /tmp/edgeai-meminfo.txt
            adb shell am force-stop com.edgeai.smoke

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-android-emulator-evidence
          path: |
            /tmp/edgeai-calc.log
            /tmp/edgeai-neural.log
            /tmp/edgeai-meminfo.txt
          if-no-files-found: warn
