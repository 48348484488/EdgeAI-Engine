name: EdgeAI v0.15 Hybrid System

on:
  push:
    branches: [v0.12-multiblock]
    paths:
      - .github/workflows/v015-hybrid-system.yml
      - benchmarks/hybrid_system_v015.py
      - benchmarks/router_paraphrase_v015.py
      - src/Router.cpp
      - src/Engine.cpp
      - include/edgeai/Types.hpp
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgeai-v015-hybrid-system
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Evaluate complete hybrid system
        run: |
          python3 benchmarks/hybrid_system_v015.py --chat build/edgeai_chat
      - name: Evaluate paraphrased router cases
        run: |
          python3 benchmarks/router_paraphrase_v015.py --chat build/edgeai_chat
      - name: Validate accounting
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in ('results/v015/hybrid_system.json','results/v015/router_paraphrases.json'):
              r=json.loads(Path(p).read_text())
              s=r['summary']
              assert s['count']==128
              assert s['tool_cases']+s['neural_cases']==128
              assert s['tool_correct']+s['neural_correct']==s['correct']
              print(p,json.dumps(s))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-v015-hybrid-system
          path: |
            results/v015/hybrid_system.json
            results/v015/router_paraphrases.json
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v015/hybrid_system.json results/v015/router_paraphrases.json
          git commit -m "bench: record v0.15 hybrid system result" || exit 0
          git fetch origin v0.12-multiblock
          git rebase origin/v0.12-multiblock
          git push origin HEAD:v0.12-multiblock
