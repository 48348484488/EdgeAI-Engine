name: EdgeAI v0.12 New-Block Warmup

on:
  push:
    branches: [v0.12-multiblock]
    paths:
      - .github/workflows/v012-warmup.yml
      - .github/v012-warmup-trigger
      - benchmarks/instruction_blocks_warmup_v012.py
      - tests/test_v012_warmup.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgeai-v012-warmup
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build native evaluator
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - name: Install CPU Python dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
      - name: Warmup contract tests
        run: python3 -m unittest tests.test_v012_warmup
      - name: Train new-block warmup models
        run: python3 benchmarks/instruction_blocks_warmup_v012.py
      - name: Validate gradient mechanism
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/v012_warmup/training.json').read_text())
          assert d['completed']==3 and d['warmup_steps']==1024
          for r in d['runs']:
              p={x['step']:x for x in r['gradient_probes']}
              assert p[1]['new_output_grad_l2']>0
              assert p[1]['new_inner_grad_l2']==0
              assert p[2]['new_inner_grad_l2']>0
              assert p[1024]['phase']=='new_block'
              assert p[1025]['phase']=='all'
          print('gradient mechanism validated')
          PY
      - name: Prepare native evaluation report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=json.loads(Path('results/v012_warmup/training.json').read_text())
          runs=[]
          for r in w['runs']:
              runs.append(dict(seed=r['seed'],blocks=2,after_path=r['after_path'],artifacts=r['artifacts'],
                               parameters=r['parameters'],file_bytes=r['file_bytes'],
                               selected_validation_nll=r['selected_validation_nll'],
                               train_cpu_seconds=r['train_cpu_seconds'],steps=r['steps']))
          out=dict(expected=3,completed=3,architectures=[1,2],fairness_verified=True,
                   dataset_sha256=w['dataset_sha256'],runs=runs)
          Path('results/v012_warmup/eval_input.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: Native generation evaluation
        run: python3 benchmarks/instruction_blocks_eval_v012.py --build build --report results/v012_warmup/eval_input.json --out results/v012_warmup/evaluation.json
      - name: Compare baseline, equal-update and warmup
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path('results/v012/evaluation.json').read_text())
          eq=json.loads(Path('results/v012_equal_steps/evaluation.json').read_text())
          wu=json.loads(Path('results/v012_warmup/evaluation.json').read_text())
          one={r['seed']:r for r in base['runs'] if r['blocks']==1}
          equal={r['seed']:r for r in eq['runs']}
          warm={r['seed']:r for r in wu['runs']}
          pairs=[]
          for s in (11,22,33):
              pairs.append(dict(seed=s,
                  one_correct=one[s]['summary']['correct'],
                  two_equal_updates_correct=equal[s]['summary']['correct'],
                  two_warmup_correct=warm[s]['summary']['correct'],
                  warmup_vs_equal_delta=warm[s]['summary']['correct']-equal[s]['summary']['correct'],
                  warmup_vs_one_delta=warm[s]['summary']['correct']-one[s]['summary']['correct']))
          out=dict(protocol='1024-step new-block-only warmup then joint fine-tuning',
                   pairs=pairs,
                   one_total=sum(x['one_correct'] for x in pairs),
                   equal_updates_total=sum(x['two_equal_updates_correct'] for x in pairs),
                   warmup_total=sum(x['two_warmup_correct'] for x in pairs))
          out['warmup_vs_equal_delta']=out['warmup_total']-out['equal_updates_total']
          out['warmup_vs_one_delta']=out['warmup_total']-out['one_total']
          Path('results/v012_warmup/comparison.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY
      - name: Upload warmup evidence
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-v012-warmup
          path: |
            results/v012_warmup/
            models/v012_warmup/
          if-no-files-found: error
      - name: Commit compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v012_warmup
          git commit -m "bench: record v0.12 new-block warmup ablation" || exit 0
          git fetch origin v0.12-multiblock
          git rebase origin/v0.12-multiblock
          git push origin HEAD:v0.12-multiblock
