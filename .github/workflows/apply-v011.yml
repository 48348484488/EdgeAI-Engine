name: Apply EdgeAI v0.11 patch

on:
  push:
    paths:
      - '.github/patches/v011.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          set -euo pipefail
          git apply --check .github/patches/v011.patch
          git apply .github/patches/v011.patch
          rm .github/patches/v011.patch
      - name: Commit v0.11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "EdgeAI v0.11: improve definition-aware code search"
          git push
