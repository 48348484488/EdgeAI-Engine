name: EdgeAI v0.12 Generation Selection

on:
  push:
    branches: [v0.12-multiblock]
    paths:
      - .github/workflows/v012-generation-selection.yml
      - benchmarks/run_v012_generation_selection.py
      - benchmarks/instruction_blocks_generation_select_v012.py
      - tests/test_v012_generation_selection.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgeai-v012-generation-selection
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build native evaluator
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - name: Install CPU Python dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
      - name: Selection contract tests
        run: python3 -m unittest tests.test_v012_generation_selection
      - name: Replay seed33 and select by validation generation
        run: python3 benchmarks/run_v012_generation_selection.py
      - name: Native held-out evaluation
        run: python3 benchmarks/instruction_blocks_eval_v012.py --build build --report results/v012_generation_selection/training.json --out results/v012_generation_selection/evaluation.json
      - name: Compare seed33 checkpoints
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path('results/v012/evaluation.json').read_text())
          eq=json.loads(Path('results/v012_equal_steps/evaluation.json').read_text())
          gs=json.loads(Path('results/v012_generation_selection/evaluation.json').read_text())
          one=next(r for r in base['runs'] if r['seed']==33 and r['blocks']==1)
          old=next(r for r in eq['runs'] if r['seed']==33)
          new=gs['runs'][0]
          out=dict(seed=33,
                   one_block_correct=one['summary']['correct'],
                   two_block_nll_selected_correct=old['summary']['correct'],
                   two_block_generation_selected_correct=new['summary']['correct'],
                   generation_selection_delta=new['summary']['correct']-old['summary']['correct'],
                   selected_step=new['steps'] if False else new.get('selected_step'))
          Path('results/v012_generation_selection/comparison.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-v012-generation-selection
          path: |
            results/v012_generation_selection/
            models/v012_generation_selection/
          if-no-files-found: error
      - name: Commit compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v012_generation_selection
          git commit -m "bench: record v0.12 generation checkpoint selection" || exit 0
          git fetch origin v0.12-multiblock
          git rebase origin/v0.12-multiblock
          git push origin HEAD:v0.12-multiblock
