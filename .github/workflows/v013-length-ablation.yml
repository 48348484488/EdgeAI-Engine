name: EdgeAI v0.13 Length Bridge Ablation
on:
  push:
    branches: [v0.13-curriculum]
    paths:
      - .github/v013-length-ablation-trigger
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: edgeai-v013-length-ablation
  cancel-in-progress: true
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build sealed length-bridge dataset
        run: |
          python3 -m unittest tests.test_v013_length_curriculum
          python3 tools/instruction_data_v013_length.py
          for s in valid test_id test_template test_range test_family; do
            cmp "data/instructions_v07/$s.jsonl" "data/instructions_v013_length/$s.jsonl"
          done
      - name: Build native evaluator
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - name: Install CPU Python dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
      - name: Train one versus two blocks
        run: |
          python3 benchmarks/instruction_blocks_v012.py             --cpu-seconds 60 --seeds 11 22 33 --threads 1 --architectures 1 2             --data data/instructions_v013_length             --out results/v013_length/training.json             --model-dir models/v013_length
      - name: Native sealed-test evaluation
        run: |
          python3 benchmarks/instruction_blocks_eval_v012.py             --build build             --report results/v013_length/training.json             --data data/instructions_v013_length             --out results/v013_length/evaluation.json
      - name: Compare length extrapolation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=json.loads(Path('results/v013/evaluation.json').read_text())
          new=json.loads(Path('results/v013_length/evaluation.json').read_text())
          def task_range(report):
              out={}
              for r in report['runs']:
                  key=(r['seed'],r['blocks'])
                  es=[e for e in report['examples'] if e['seed']==r['seed'] and e['blocks']==r['blocks'] and e['split']=='test_range']
                  by={}
                  for task in sorted({e['task'] for e in es}):
                      rows=[e for e in es if e['task']==task]
                      by[task]=dict(correct=sum(bool(x['correct']) for x in rows),count=len(rows))
                  out[key]=dict(total=r['summary']['correct'],range=r['by_split']['test_range']['correct'],by_task=by)
              return out
          a,b=task_range(base),task_range(new)
          rows=[]
          for key in sorted(b):
              rows.append(dict(seed=key[0],blocks=key[1],
                old_total=a[key]['total'],new_total=b[key]['total'],
                old_range=a[key]['range'],new_range=b[key]['range'],
                old_copy=a[key]['by_task']['copy']['correct'],new_copy=b[key]['by_task']['copy']['correct'],
                old_uppercase=a[key]['by_task']['uppercase']['correct'],new_uppercase=b[key]['by_task']['uppercase']['correct'],
                old_addition=a[key]['by_task']['addition']['correct'],new_addition=b[key]['by_task']['addition']['correct'],
                old_expression=a[key]['by_task']['expression']['correct'],new_expression=b[key]['by_task']['expression']['correct']))
          out=dict(protocol='v0.13 baseline versus train-only 5-char string bridge; sealed length-6 test unchanged',rows=rows)
          Path('results/v013_length/comparison.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-v013-length-bridge
          path: |
            results/v013_length/
            data/instructions_v013_length/manifest.json
            models/v013_length/
      - name: Commit compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v013_length/ data/instructions_v013_length/
          git commit -m "bench: record v0.13 length-bridge ablation" || exit 0
          git fetch origin v0.13-curriculum
          git rebase origin/v0.13-curriculum
          git push origin HEAD:v0.13-curriculum
