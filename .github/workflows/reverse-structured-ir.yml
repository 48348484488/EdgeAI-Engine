name: ARM structured IR validation

on:
  push:
    paths:
      - 'tools/arm_structured_ir.py'
      - 'tools/arm_semantic_ir.py'
      - 'tools/arm_register_flow_ir.py'
      - 'tools/arm_loop_predicates.py'
      - 'tools/arm_control_regions.py'
      - 'tools/arm_loop_analysis.py'
      - 'tests/test_arm_structured_ir.py'
      - 'tests/test_arm_semantic_ir.py'
      - 'tests/test_arm_register_flow_ir.py'
      - 'tests/test_arm_flags_flow.py'
      - 'tests/test_arm_loop_predicates.py'
      - 'tests/test_arm_control_regions.py'
      - 'tests/test_arm_loop_analysis.py'
      - 'examples/reverse/tictactoe.c'
      - 'examples/reverse/array_sum.c'
      - 'examples/reverse/arm_branch_increment.S'
      - 'examples/reverse/arm_flags_reference.S'
      - '.github/workflows/reverse-structured-ir.yml'
  pull_request:
  workflow_dispatch:

jobs:
  structural-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM ARM compiler and objdump
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          clang --version | head -n 1
      - name: Verify CFG loops and postdominators
        run: |
          python3 -m unittest discover -s tests -p 'test_arm_loop_analysis.py' -v
          python3 -m unittest discover -s tests -p 'test_arm_control_regions.py' -v
      - name: Verify structured IR, including compiled ARM ELF cases
        run: python3 -m unittest discover -s tests -p 'test_arm_structured_ir.py' -v
      - name: Verify conservative ARM instruction effects
        run: python3 -m unittest discover -s tests -p 'test_arm_semantic_ir.py' -v
      - name: Verify register dataflow and CMP-to-BNE expressions
        run: python3 -m unittest discover -s tests -p 'test_arm_register_flow_ir.py' -v
      - name: Verify ARM flag-setting operations on real ELF
        run: python3 -m unittest discover -s tests -p 'test_arm_flags_flow.py' -v
      - name: Verify ARM loop counter and backedge predicates
        run: python3 -m unittest discover -s tests -p 'test_arm_loop_predicates.py' -v
      - name: Generate real ARM32 function IR
        run: |
          mkdir -p results
          clang --target=armv7-none-eabi -marm -O1 -fno-inline -nostdlib -fuse-ld=lld -Wl,-Ttext=0x1000 -Wl,-e=start examples/reverse/tictactoe.c -o results/game_structural_arm.elf
          clang --target=armv7-none-eabi -marm -O1 -fno-inline -nostdlib -fuse-ld=lld -Wl,-Ttext=0x1000 -Wl,-e=start examples/reverse/array_sum.c -o results/array_structural_arm.elf
          python3 tools/arm_structured_ir.py results/game_structural_arm.elf --function winner --output results/winner_structured_ir.json
          python3 tools/arm_structured_ir.py results/game_structural_arm.elf --function play --output results/play_structured_ir.json
          python3 tools/arm_structured_ir.py results/array_structural_arm.elf --function sum_array --output results/sum_array_structured_ir.json
          clang --target=armv7-none-eabi -marm -nostdlib -fuse-ld=lld -Wl,-Ttext=0x1000 -Wl,-e,start examples/reverse/arm_branch_increment.S -o results/guard_structural_arm.elf
          python3 tools/arm_structured_ir.py results/guard_structural_arm.elf --function increment_guard --output results/increment_guard_structured_ir.json
          clang --target=armv7-none-eabi -marm -nostdlib -fuse-ld=lld -Wl,-Ttext=0x1000 -Wl,-e,start examples/reverse/arm_flags_reference.S -o results/flags_structural_arm.elf
          python3 tools/arm_structured_ir.py results/flags_structural_arm.elf --function sub_flag_guard --output results/sub_flag_guard_ir.json
          python3 tools/arm_structured_ir.py results/flags_structural_arm.elf --function unsigned_flag_guard --output results/unsigned_flag_guard_ir.json
          python3 tools/arm_structured_ir.py results/flags_structural_arm.elf --function shifted_flag_guard --output results/shifted_flag_guard_ir.json
      - name: Validate generated IR summaries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for function in ('winner','play','sum_array'):
              data=json.loads(Path('results/'+function+'_structured_ir.json').read_text())
              assert data['proof_status']=='structural_only', (function,data)
              assert not data['proof_status']=='unknown_control_flow',function
              assert len(data['instruction_effects']) > 0, function
              assert data['semantic_coverage']['recognized'] > 0, function
              assert data['semantic_coverage']['recognized'] + data['semantic_coverage']['unsupported'] == len(data['instruction_effects'])
              assert 0 < data['register_flow']['analyzed_instructions'] <= len(data['instruction_effects']), function
              assert isinstance(data['register_flow']['branch_conditions'], list), function
          assert len(json.loads(Path('results/winner_structured_ir.json').read_text())['loops'])==1
          assert len(json.loads(Path('results/sum_array_structured_ir.json').read_text())['loops'])==1
          guard=json.loads(Path('results/increment_guard_structured_ir.json').read_text())
          branches=guard['register_flow']['branch_conditions']
          assert len(branches)==1, branches
          assert branches[0]['predicate']=='ne'
          assert branches[0]['source']['left']['operation']=='add'
          assert branches[0]['source']['left']['left']['register']=='r0'
          assert branches[0]['source']['right']['value']==8
          for function,condition,edge in [('sub_flag_guard','eq','taken'),
                                          ('unsigned_flag_guard','hi','taken'),
                                          ('shifted_flag_guard','eq','fallthrough')]:
              data=json.loads(Path('results/'+function+'_ir.json').read_text())
              decisions=data['register_flow']['branch_conditions']
              assert len(decisions)==1, (function,decisions)
              assert decisions[0]['predicate']==condition, function
              assert decisions[0]['edge_proven']==edge, function
              assert data['semantic_coverage']['unsupported']==0, function
          winner=json.loads(Path('results/winner_structured_ir.json').read_text())
          sum_data=json.loads(Path('results/sum_array_structured_ir.json').read_text())
          for data,delta,bound,mode,early in [
              (winner,1,8,'cmp_after_update',True),
              (sum_data,-1,0,'update_sets_zero',False)]:
              loops=data['loop_predicates']['loops']
              assert len(loops)==1,loops
              candidate=loops[0]['latches']
              assert len(candidate)==1 and candidate[0]['status']=='counter_candidate',candidate
              assert candidate[0]['delta']==delta and candidate[0]['bound']==bound,candidate
              assert candidate[0]['compare_mode']==mode,candidate
              assert bool(loops[0]['early_exit_edges'])==early,loops
              assert candidate[0]['iteration_count_proven'] is False
          print('ARM32 structural IR and loop predicates: real ELF checks verified')
          PY
      - name: Upload ARM structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-arm-structured-ir
          path: |
            results/winner_structured_ir.json
            results/play_structured_ir.json
            results/sum_array_structured_ir.json
            results/increment_guard_structured_ir.json
            results/sub_flag_guard_ir.json
            results/unsigned_flag_guard_ir.json
            results/shifted_flag_guard_ir.json
          if-no-files-found: warn
