name: EdgeAI CI

on:
  push:
    branches: [main, v0.12-multiblock, v0.16-low-resource]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 && python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
      - name: Install LLVM binary analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y llvm
          command -v llvm-objdump
          command -v llvm-objcopy
      - name: Generic 3D skinning differential (100000 deterministic vertices)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude tests/test_edgeai_lbs_kernel.cpp -o /tmp/edgeai_lbs_test
          /tmp/edgeai_lbs_test
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Capture current ARM32 LLVM fingerprints after test failure
        if: failure()
        shell: bash
        run: |
          mkdir -p results/arm32-llvm-diagnostics
          clang --version > results/arm32-llvm-diagnostics/clang-version.txt 2>&1 || true
          llvm-objdump --version > results/arm32-llvm-diagnostics/objdump-version.txt 2>&1 || true
          for opt in 1 2 3 s z; do
            clang --target=armv7-none-eabi -marm "-O$opt" -fno-inline \
              -nostdlib -fuse-ld=lld -Wl,-Ttext=0x1000 -Wl,-e=start \
              examples/reverse/tictactoe.c \
              -o "results/arm32-llvm-diagnostics/winner-O$opt.elf" \
              > "results/arm32-llvm-diagnostics/compile-O$opt.log" 2>&1 || continue
            llvm-objdump -d "results/arm32-llvm-diagnostics/winner-O$opt.elf" \
              > "results/arm32-llvm-diagnostics/disassembly-O$opt.txt" 2>&1 || true
          done

      - name: Upload ARM32 fingerprint evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-arm32-llvm-fingerprint-evidence
          path: results/arm32-llvm-diagnostics/
          if-no-files-found: warn
