name: Diagnose v0.12 generalization
on:
  push:
    branches: [v0.12-multiblock]
    paths: [.github/workflows/v012-generalization-diagnose.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 benchmarks/analyze_v012_generalization.py
      - name: Commit diagnosis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v012/generalization_diagnosis.json
          git commit -m "bench: record v0.12 generalization diagnosis" || exit 0
          git fetch origin v0.12-multiblock
          git rebase origin/v0.12-multiblock
          git push origin HEAD:v0.12-multiblock
