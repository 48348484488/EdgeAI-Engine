name: EdgeAI v0.12 Equal Updates Ablation

on:
  push:
    branches: [v0.12-multiblock]
    paths:
      - .github/workflows/v012-equal-updates.yml
      - .github/v012-equal-updates-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgeai-v012-equal-updates
  cancel-in-progress: false

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: Native tests
        run: ctest --test-dir build --output-on-failure

      - name: Install CPU Python dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3'

      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Train two-block models to frozen one-block update counts
        run: |
          python3 benchmarks/instruction_blocks_equal_steps_v012.py \
            --seeds 11 22 33 --threads 1 \
            --baseline results/v012/training.json \
            --out results/v012_equal_steps/training.json \
            --model-dir models/v012_equalsteps

      - name: Native equal-update evaluation
        run: |
          python3 benchmarks/instruction_blocks_equal_steps_eval_v012.py \
            --build build \
            --training results/v012_equal_steps/training.json \
            --baseline-eval results/v012/evaluation.json \
            --out results/v012_equal_steps/evaluation.json

      - name: Validate ablation evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('results/v012_equal_steps/training.json').read_text())
          e=json.loads(Path('results/v012_equal_steps/evaluation.json').read_text())
          assert t['completed']==3 and t['expected']==3 and t['fairness_verified'] is True
          assert {(r['seed'],r['blocks']) for r in t['runs']}=={(11,2),(22,2),(33,2)}
          assert e['completed']==3
          assert {p['seed'] for p in e['pairs']}=={11,22,33}
          assert all(r['steps']==r['target_steps'] for r in t['runs'])
          print(json.dumps(dict(one_correct=e['one_correct'],two_correct=e['two_correct'],
                                delta=e['correct_delta'],cpu_ratio=e['median_train_cpu_ratio'],
                                latency_ratio=e['median_latency_ratio'])))
          PY

      - name: Upload equal-update evidence
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-v012-equal-updates
          if-no-files-found: error
          retention-days: 30
          path: |
            results/v012_equal_steps/
            models/v012_equalsteps/

      - name: Commit compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v012_equal_steps
          git diff --cached --quiet && exit 0
          git commit -m "bench: record v0.12 equal-update ablation"
          for attempt in 1 2 3; do
            git fetch origin v0.12-multiblock
            git rebase origin/v0.12-multiblock
            if git push origin HEAD:v0.12-multiblock; then
              exit 0
            fi
          done
          exit 1
