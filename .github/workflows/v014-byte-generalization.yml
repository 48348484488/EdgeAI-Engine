name: EdgeAI v0.14 Byte Generalization Ablation

on:
  push:
    branches: [v0.12-multiblock]
    paths:
      - .github/workflows/v014-byte-generalization.yml
      - benchmarks/instruction_byte_v014.py
      - tests/test_v014_byte_tokenizer.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgeai-v014-byte-generalization
  cancel-in-progress: true

jobs:
  byte-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install CPU Python dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3'

      - name: Byte remap contract tests
        run: python3 -m unittest tests.test_v014_byte_tokenizer

      - name: Verify v0.13 sealed tests
        run: |
          for s in test_id test_template test_range test_family; do
            cmp "data/instructions_v07/$s.jsonl" "data/instructions_v013/$s.jsonl"
          done

      - name: Configure and build native evaluator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2

      - name: Train pure-byte one and two block models
        run: |
          python3 benchmarks/instruction_byte_v014.py             --cpu-seconds 60             --seeds 11 22 33             --threads 1             --architectures 1 2             --data data/instructions_v013             --out results/v014/training.json             --model-dir models/v014

      - name: Native sealed-test evaluation
        run: |
          python3 benchmarks/instruction_blocks_eval_v012.py             --build build             --report results/v014/training.json             --data data/instructions_v013             --out results/v014/evaluation.json

      - name: Compare BPE versus pure byte
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          bpe=json.loads(Path('results/v013/evaluation.json').read_text())
          byt=json.loads(Path('results/v014/evaluation.json').read_text())
          a={(r['seed'],r['blocks']):r for r in bpe['runs']}
          b={(r['seed'],r['blocks']):r for r in byt['runs']}
          rows=[]
          for key in sorted(b):
              x,y=a[key],b[key]
              rows.append(dict(seed=key[0],blocks=key[1],
                  bpe_total=x['summary']['correct'],byte_total=y['summary']['correct'],
                  bpe_range=x['by_split']['test_range']['correct'],byte_range=y['by_split']['test_range']['correct'],
                  bpe_family=x['by_split']['test_family']['correct'],byte_family=y['by_split']['test_family']['correct'],
                  bpe_id=x['by_split']['test_id']['correct'],byte_id=y['by_split']['test_id']['correct'],
                  bpe_template=x['by_split']['test_template']['correct'],byte_template=y['by_split']['test_template']['correct']))
          out=dict(protocol='v0.13 BPE versus v0.14 pure-byte tokenization; same curriculum and sealed tests',rows=rows)
          Path('results/v014/comparison.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: edgeai-v014-byte-generalization
          path: |
            results/v014/
            models/v014/

      - name: Commit compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v014/
          git commit -m "bench: record v0.14 byte-token ablation" || exit 0
          git fetch origin v0.12-multiblock
          git rebase origin/v0.12-multiblock
          git push origin HEAD:v0.12-multiblock
