name: EdgeAI v0.12 Fresh Holdout

on:
  push:
    branches: [v0.12-multiblock]
    paths:
      - .github/workflows/v012-fresh-holdout.yml
      - benchmarks/v012_fresh_holdout.py
      - tests/test_v012_fresh_holdout.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: edgeai-v012-fresh-holdout
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build native generator
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - name: Test fresh holdout construction
        run: python3 -m unittest tests.test_v012_fresh_holdout
      - name: Download frozen one-block benchmark artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36993561538
          name: edgeai-v012-block-benchmark
          path: artifacts/baseline
      - name: Download frozen low-LR depth candidate artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36998505586
          name: edgeai-v012-copy-inner-low-lr
          path: artifacts/candidate
      - name: Evaluate fresh unused-range holdout
        run: |
          python3 benchmarks/v012_fresh_holdout.py             --build build             --baseline-root artifacts/baseline             --candidate-root artifacts/candidate             --out results/v012_fresh_holdout/evaluation.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-v012-fresh-holdout
          retention-days: 30
          path: results/v012_fresh_holdout/evaluation.json
      - name: Commit compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v012_fresh_holdout/evaluation.json
          git diff --cached --quiet && exit 0
          git commit -m "bench: record v0.12 fresh holdout"
          for attempt in 1 2 3; do
            git fetch origin v0.12-multiblock
            git rebase origin/v0.12-multiblock
            if git push origin HEAD:v0.12-multiblock; then exit 0; fi
          done
          exit 1
