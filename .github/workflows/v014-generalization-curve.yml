name: EdgeAI v0.14 Generalization Curve

on:
  push:
    branches: [v0.12-multiblock]
    paths:
      - .github/workflows/v014-generalization-curve.yml
      - benchmarks/generalization_curve_v014.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  curve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen v0.13 models
        uses: actions/download-artifact@v4
        with:
          name: edgeai-v013-generalization
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37001471024

      - name: Download frozen v0.14 models
        uses: actions/download-artifact@v4
        with:
          name: edgeai-v014-byte-generalization
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37002862304

      - name: Build native generator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2

      - name: Measure frozen-model boundary curves
        run: python3 benchmarks/generalization_curve_v014.py --build build --out results/v014/generalization_curve.json

      - name: Upload curve evidence
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-v014-generalization-curve
          path: results/v014/generalization_curve.json

      - name: Commit compact curve
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v014/generalization_curve.json
          git commit -m "bench: record v0.14 generalization curve" || exit 0
          git fetch origin v0.12-multiblock
          git rebase origin/v0.12-multiblock
          git push origin HEAD:v0.12-multiblock
