name: EdgeAI v0.12 Block Benchmark

on:
  push:
    branches: [v0.12-multiblock]
    paths:
      - .github/workflows/v012-benchmark.yml
      - .github/v012-benchmark-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edgeai-v012-block-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j2

      - name: Native tests
        run: ctest --test-dir build --output-on-failure

      - name: Install CPU Python dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3'

      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Python native parity
        run: python3 tools/verify_multiblock.py --build build --out results/v012/multiblock_parity.json

      - name: Train one versus two blocks
        run: |
          python3 benchmarks/instruction_blocks_v012.py             --cpu-seconds 60             --seeds 11 22 33             --threads 1             --architectures 1 2             --out results/v012/training.json             --model-dir models/v012

      - name: Native evaluation
        run: |
          python3 benchmarks/instruction_blocks_eval_v012.py             --build build             --report results/v012/training.json             --out results/v012/evaluation.json

      - name: Validate benchmark outputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/v012/multiblock_parity.json').read_text())
          t=json.loads(Path('results/v012/training.json').read_text())
          e=json.loads(Path('results/v012/evaluation.json').read_text())
          assert p['all_passed'] is True
          assert t['completed']==6 and t['expected']==6 and t['fairness_verified'] is True
          assert e['completed']==6
          assert {(r['seed'],r['blocks']) for r in t['runs']}=={(s,b) for s in (11,22,33) for b in (1,2)}
          assert {(r['seed'],r['blocks']) for r in e['runs']}=={(s,b) for s in (11,22,33) for b in (1,2)}
          print('v0.12 benchmark outputs validated')
          PY

      - name: Upload v0.12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-v012-block-benchmark
          path: |
            results/v012/
            models/v012/
          if-no-files-found: error

      - name: Commit reproducible benchmark evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v012 models/v012
          git diff --cached --quiet && exit 0
          git commit -m "bench: record v0.12 one versus two block results"
          git push origin HEAD:v0.12-multiblock
