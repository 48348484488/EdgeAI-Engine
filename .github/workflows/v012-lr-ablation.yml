name: EdgeAI v0.12 LR Ablation
on:
  push:
    branches: [v0.12-multiblock]
    paths: [.github/workflows/v012-lr-ablation.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: edgeai-v012-lr-ablation
  cancel-in-progress: true
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2
      - run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
      - name: Train seed33 LR candidates
        run: python3 benchmarks/instruction_blocks_lr_ablation_v012.py
      - name: Native generation evaluation
        run: |
          python3 benchmarks/instruction_blocks_eval_v012.py --build build --report results/v012_lr_ablation/training.json --out results/v012_lr_ablation/evaluation.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-v012-lr-ablation
          path: |
            results/v012_lr_ablation/
            models/v012_lr_ablation/
      - name: Commit compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v012_lr_ablation/
          git commit -m "bench: record v0.12 LR ablation" || exit 0
          git fetch origin v0.12-multiblock
          git rebase origin/v0.12-multiblock
          git push origin HEAD:v0.12-multiblock
