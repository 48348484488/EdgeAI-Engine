name: Reverse engineering ARM reference

on:
  push:
    paths:
      - 'tools/arm_*.py'
      - 'tools/validate_arm_reference.py'
      - 'tools/validate_tictactoe_arm.py'
      - 'tools/inspect_tictactoe_memory.py'
      - 'tools/arm_play_evidence.py'
      - 'tools/generate_play_candidate.py'
      - 'tools/arm_cpp_emitter.py'
      - 'tools/infer_play_rules.py'
      - 'tools/validate_play_reconstruction.py'
      - 'tools/validate_play_arm_emulation.py'
      - 'tools/recover_winner.py'
      - 'tools/recover_winner_stripped.py'
      - 'tools/recover_winner_variants.py'
      - 'tools/validate_winner_variants.py'
      - 'tools/validate_winner_qemu.py'
      - 'tools/validate_winner_freestanding.py'
      - 'tests/winner_freestanding_arm.cpp'
      - 'tests/test_winner_freestanding.py'
      - 'tests/test_winner_qemu_contract.py'
      - 'tools/validate_winner_reconstruction.py'
      - 'tests/winner_differential_harness.cpp'
      - 'tests/test_recover_winner.py'
      - 'tests/test_recover_winner_stripped.py'
      - 'tests/test_recover_winner_variants.py'
      - 'tests/play_differential_harness.cpp'
      - 'examples/reverse/tictactoe.c'
      - 'tests/test_arm*.py'
      - 'tests/test_thumb_calls.py'
      - 'tests/test_tictactoe_board_flow.py'
      - '.github/workflows/reverse-arm-reference.yml'
  pull_request:
  workflow_dispatch:

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM compiler and disassembler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm qemu-user gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
      - name: Unit tests
        run: |
          python3 -m unittest discover -s tests -p 'test_arm_cfg.py' -v
          python3 -m unittest discover -s tests -p 'test_arm_functions.py' -v
          python3 -m unittest discover -s tests -p 'test_thumb_calls.py' -v
      - name: Verify conservative ARM flow outline
        run: python3 -m unittest discover -s tests -p 'test_arm_flow_outline.py' -v
      - name: Test ARM semantic annotations
        run: python3 -m unittest discover -s tests -p 'test_arm_semantics.py' -v
      - name: Test ARM constant propagation
        run: python3 -m unittest discover -s tests -p 'test_arm_constants.py' -v
      - name: Test ARM dataflow joins
        run: python3 -m unittest discover -s tests -p 'test_arm_dataflow.py' -v
      - name: Test ARM memory analysis
        run: python3 -m unittest discover -s tests -p 'test_arm_memory.py' -v
      - name: Test ARM memory through CFG
        run: python3 -m unittest discover -s tests -p 'test_arm_memory_flow.py' -v
      - name: Test ARM memory flow
        run: python3 -m unittest discover -s tests -p 'test_arm_memory_flow.py' -v
      - name: Verify indexed ARM address resolution
        run: python3 -m unittest discover -s tests -p 'test_arm_address_resolver.py' -v
      - name: Verify symbolic ARM flow
        run: python3 -m unittest discover -s tests -p 'test_arm_symbolic_flow.py' -v
      - name: Verify play register evidence
        run: python3 -m unittest discover -s tests -p 'test_arm_play_evidence.py' -v
      - name: Inventory memory accesses in compiled game
        run: |
          mkdir -p results
          python3 tools/inspect_tictactoe_memory.py | tee results/arm_play_inspection_latest.json
      - name: Verify real board load and store
        run: python3 -m unittest discover -s tests -p 'test_tictactoe_board_flow.py' -v
      - name: Test compiled tic-tac-toe game
        run: python3 tools/validate_tictactoe_arm.py
      - name: Verify compiled ARM play outcome classes
        run: python3 -m unittest discover -s tests -p 'test_arm_play_outcomes.py' -v
      - name: Verify unsigned ARM branch constraints
        run: python3 -m unittest discover -s tests -p 'test_arm_unsigned_paths.py' -v
      - name: Verify symbolic path constraints
        run: python3 -m unittest discover -s tests -p 'test_arm_path_constraints.py' -v
      - name: Verify compiled ARM path events
        run: python3 -m unittest discover -s tests -p 'test_arm_play_paths.py' -v
      - name: Verify branches in compiled game
        run: python3 -m unittest discover -s tests -p 'test_arm_compiled_branches.py' -v
      - name: Verify graph structure summaries
        run: python3 -m unittest discover -s tests -p 'test_arm_graph_structure.py' -v
      - name: Verify ARM control-flow IR
        run: python3 -m unittest discover -s tests -p 'test_arm_ir_graph.py' -v
      - name: Verify ARM instruction IR lifting
        run: python3 -m unittest discover -s tests -p 'test_arm_ir_lifter.py' -v
      - name: Verify ARM intermediate representation
        run: python3 -m unittest discover -s tests -p 'test_arm_ir.py' -v
      - name: Verify C++ statement emitter
        run: python3 -m unittest discover -s tests -p 'test_arm_cpp_emitter.py' -v
      - name: Compare reconstructed C++ play with original compiled game
        run: python3 tools/validate_play_reconstruction.py
      - name: Differential ARM32 execution under QEMU
        run: python3 tools/validate_play_arm_emulation.py
      - name: Cross-check winner via independent ARM32 ELF verifier
        run: python3 -m unittest discover -s tests -p 'test_arm_winner_reconstruct.py' -v
      - name: Test CFG branch reconvergence and postdominators
        run: python3 -m unittest discover -s tests -p 'test_arm_control_regions.py' -v
      - name: Test generic ARM loop and table analysis
        run: python3 -m unittest discover -s tests -p 'test_arm_loop_analysis.py' -v
      - name: Save generic winner ARM loop analysis
        run: |
          clang --target=armv7-none-eabi -marm -O1 -fno-inline -nostdlib -fuse-ld=lld -Wl,-Ttext=0x1000 -Wl,-e,start examples/reverse/tictactoe.c -o results/arm_loop_reference.elf
          python3 tools/arm_loop_analysis.py results/arm_loop_reference.elf --function winner --output results/arm_winner_loops_latest.json
          python3 tools/arm_control_regions.py results/arm_loop_reference.elf --function winner --output results/arm_winner_regions_latest.json
          python3 tools/arm_control_regions.py results/arm_loop_reference.elf --function play --output results/arm_play_regions_latest.json
      - name: Recover winner directly from compiled ARM ELF
        run: python3 -m unittest discover -s tests -p 'test_recover_winner.py' -v
      - name: Recover winner without ELF symbols
        run: python3 -m unittest discover -s tests -p 'test_recover_winner_stripped.py' -v
      - name: Differential validation of reconstructed winner
        run: python3 tools/validate_winner_reconstruction.py
      - name: Differential validation with stripped winner ELF
        run: |
          python3 tools/validate_winner_reconstruction.py --strip --output results/winner_stripped_test.json --candidate-output results/winner_stripped_candidate.cpp
      - name: Regression test five stripped ARM winner optimizations
        run: python3 -m unittest discover -s tests -p 'test_recover_winner_variants.py' -v
      - name: Differential comparison across Clang O1 O2 O3 Os Oz
        run: python3 tools/validate_winner_variants.py --output results/winner_variants_validation.json
      - name: QEMU runner fail-closed contract tests
        run: python3 -m unittest discover -s tests -p 'test_winner_qemu_contract.py' -v
      - name: Actual ARM32 differential with GCC-built binaries under QEMU
        run: python3 tools/validate_winner_qemu.py --output results/winner_qemu_arm32.json
      - name: Verify sysroot-free ARM32 executables and no false QEMU success
        run: python3 -m unittest discover -s tests -p 'test_winner_freestanding.py' -v
      - name: Run independent real ARM32 Linux EABI tests under QEMU
        run: python3 tools/validate_winner_freestanding.py --require-qemu --output results/winner_freestanding_arm32.json --save-runners results/arm32_binaries
      - name: Real ELF validation against LLVM
        run: |
          python3 tools/validate_arm_reference.py --output results/arm_reference_latest.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-reference-validation
          path: |
            results/arm_reference_latest.json
            results/play_reconstruction_test.json
            results/play_arm_emulation.json
            results/arm_play_inspection_latest.json
            results/arm_winner_loops_latest.json
            results/arm_winner_regions_latest.json
            results/arm_play_regions_latest.json
            results/winner_reconstruction_test.json
            results/winner_candidate.cpp
            results/winner_stripped_test.json
            results/winner_stripped_candidate.cpp
            results/winner_variants_validation.json
            results/winner_variant_*.json
            results/winner_variant_*.cpp
            results/winner_qemu_arm32.json
            results/winner_freestanding_arm32.json
            results/arm32_binaries/*.elf
          if-no-files-found: warn
