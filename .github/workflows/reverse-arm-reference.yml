name: Reverse engineering ARM reference

on:
  push:
    paths:
      - 'tools/arm_*.py'
      - 'tools/validate_arm_reference.py'
      - 'tools/validate_tictactoe_arm.py'
      - 'tools/inspect_tictactoe_memory.py'
      - 'tools/arm_play_evidence.py'
      - 'tools/generate_play_candidate.py'
      - 'tools/validate_play_reconstruction.py'
      - 'tests/play_differential_harness.cpp'
      - 'examples/reverse/tictactoe.c'
      - 'tests/test_arm*.py'
      - 'tests/test_thumb_calls.py'
      - 'tests/test_tictactoe_board_flow.py'
      - '.github/workflows/reverse-arm-reference.yml'
  pull_request:
  workflow_dispatch:

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM compiler and disassembler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Unit tests
        run: |
          python3 -m unittest discover -s tests -p 'test_arm_cfg.py' -v
          python3 -m unittest discover -s tests -p 'test_arm_functions.py' -v
          python3 -m unittest discover -s tests -p 'test_thumb_calls.py' -v
      - name: Verify conservative ARM flow outline
        run: python3 -m unittest discover -s tests -p 'test_arm_flow_outline.py' -v
      - name: Test ARM semantic annotations
        run: python3 -m unittest discover -s tests -p 'test_arm_semantics.py' -v
      - name: Test ARM constant propagation
        run: python3 -m unittest discover -s tests -p 'test_arm_constants.py' -v
      - name: Test ARM dataflow joins
        run: python3 -m unittest discover -s tests -p 'test_arm_dataflow.py' -v
      - name: Test ARM memory analysis
        run: python3 -m unittest discover -s tests -p 'test_arm_memory.py' -v
      - name: Test ARM memory through CFG
        run: python3 -m unittest discover -s tests -p 'test_arm_memory_flow.py' -v
      - name: Test ARM memory flow
        run: python3 -m unittest discover -s tests -p 'test_arm_memory_flow.py' -v
      - name: Verify indexed ARM address resolution
        run: python3 -m unittest discover -s tests -p 'test_arm_address_resolver.py' -v
      - name: Verify symbolic ARM flow
        run: python3 -m unittest discover -s tests -p 'test_arm_symbolic_flow.py' -v
      - name: Verify play register evidence
        run: python3 -m unittest discover -s tests -p 'test_arm_play_evidence.py' -v
      - name: Inventory memory accesses in compiled game
        run: python3 tools/inspect_tictactoe_memory.py
      - name: Verify real board load and store
        run: python3 -m unittest discover -s tests -p 'test_tictactoe_board_flow.py' -v
      - name: Test compiled tic-tac-toe game
        run: python3 tools/validate_tictactoe_arm.py
      - name: Compare reconstructed C++ play with original compiled game
        run: python3 tools/validate_play_reconstruction.py
      - name: Real ELF validation against LLVM
        run: |
          python3 tools/validate_arm_reference.py --output results/arm_reference_latest.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-reference-validation
          path: |
            results/arm_reference_latest.json
            results/play_reconstruction_test.json
          if-no-files-found: warn
