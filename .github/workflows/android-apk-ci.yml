name: EdgeAI Android APK CI

on:
  push:
    branches: [v0.12-multiblock]
    paths:
      - .github/workflows/android-apk-ci.yml
      - android/**
      - CMakeLists.txt
      - include/**
      - src/**
  workflow_dispatch:

concurrency:
  group: edgeai-android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify packaged ARM64 native runtime
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libedgeai_android_jni.so' /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libedgeai.so' /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libc++_shared.so' /tmp/apk-list.txt
          ! grep -q 'lib/x86' /tmp/apk-list.txt
          sha256sum "$APK" | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: edgeai-android-smoke-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
