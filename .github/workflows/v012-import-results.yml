name: Import v0.12 benchmark evidence

on:
  push:
    branches: [v0.12-multiblock]
    paths:
      - .github/workflows/v012-import-results.yml

permissions:
  contents: write
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.12-multiblock
          fetch-depth: 0

      - name: Download validated benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: edgeai-v012-block-benchmark
          path: .v012-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36992697506

      - name: Import evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/v012 models/v012
          cp -a .v012-artifact/results/v012/. results/v012/
          cp -a .v012-artifact/models/v012/. models/v012/
          rm -rf .v012-artifact

      - name: Commit evidence without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v012 models/v012
          if git diff --cached --quiet; then
            echo "Evidence already present."
            exit 0
          fi
          git commit -m "bench: record v0.12 one versus two block results"
          for attempt in 1 2 3; do
            git fetch origin v0.12-multiblock
            git rebase origin/v0.12-multiblock
            if git push origin HEAD:v0.12-multiblock; then
              exit 0
            fi
          done
          exit 1
