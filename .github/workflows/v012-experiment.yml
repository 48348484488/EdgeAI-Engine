name: EdgeAI v0.12 1x2 Experiment

on:
  workflow_dispatch:
    inputs:
      cpu_seconds:
        description: "Process CPU seconds per architecture/seed"
        required: true
        default: "60"

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python3 -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
      - name: Build native runtime
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Run Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify Python/native parity
        run: python3 tools/verify_multiblock.py --build build --out results/v012/multiblock_parity.json
      - name: Run controlled training
        run: |
          python3 benchmarks/instruction_blocks_v012.py             --cpu-seconds "${{ inputs.cpu_seconds || '60' }}"             --seeds 11 22 33 --threads 1 --architectures 1 2
      - name: Evaluate selected checkpoints with native C++
        run: |
          python3 benchmarks/instruction_blocks_eval_v012.py             --build build --report results/v012/training.json             --data data/instructions_v07 --out results/v012/evaluation.json
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgeai-v012-1x2-results
          if-no-files-found: error
          retention-days: 30
          path: |
            results/v012/
            models/v012/
